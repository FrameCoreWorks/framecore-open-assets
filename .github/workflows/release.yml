name: Tag and release after green CI

# After CI passes on main, create the tag v<version> and a GitHub Release
# when that version has no tag yet. Nothing is published for an unchanged version.
on:
  workflow_run:
    workflows: ["Validate plugin"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag-and-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Create the tag and release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('plugins/framecore-open-assets/.claude-plugin/plugin.json'))['version'])")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already exists, nothing to publish"
            exit 0
          fi
          gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes
